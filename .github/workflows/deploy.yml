name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: production-deployment
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Next.js image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.next
          push: true
          tags: ghcr.io/${{ github.repository }}/production-nextjs:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/production-nextjs:cache
          cache-to:   type=registry,ref=ghcr.io/${{ github.repository }}/production-nextjs:cache,mode=max

      - name: Build and push Python image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.hidden
          push: true
          tags: ghcr.io/${{ github.repository }}/production-python:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/production-python:cache
          cache-to:   type=registry,ref=ghcr.io/${{ github.repository }}/production-python:cache,mode=max

      - name: Build and push cost-estimator image
        uses: docker/build-push-action@v6
        with:
          context: services/cost-estimator
          file: services/cost-estimator/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/production-estimator:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/production-estimator:cache
          cache-to:   type=registry,ref=ghcr.io/${{ github.repository }}/production-estimator:cache,mode=max

      - name: Build and push hosted-worker image
        uses: docker/build-push-action@v6
        with:
          context: services/leak-worker
          file: services/leak-worker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/production-worker:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/production-worker:cache
          cache-to:   type=registry,ref=ghcr.io/${{ github.repository }}/production-worker:cache,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Write config and start image pull
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          envs: GHCR_TOKEN,GHCR_USER,REPO
          script: |
            set -euo pipefail

            cat > ~/nextjs-ai-chatbot/.env << 'EOF'
            POSTGRES_URL=${{ secrets.POSTGRES_URL }}
            AUTH_SECRET=${{ secrets.AUTH_SECRET }}
            AUTH_URL=${{ secrets.AUTH_URL }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            XAI_MASTER=${{ secrets.XAI_MASTER }}
            XAI_FREE_KEY_1=${{ secrets.XAI_FREE_KEY_1 }}
            XAI_FREE_KEY_2=${{ secrets.XAI_FREE_KEY_2 }}
            XAI_FREE_KEY_3=${{ secrets.XAI_FREE_KEY_3 }}
            MEM0_API_KEY=${{ secrets.MEM0_API_KEY }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            COMPETEMATH_REDIS_URL=${{ secrets.COMPETEMATH_REDIS_URL }}
            STRIPE_SECRET=${{ secrets.STRIPE_SECRET }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            ESTIMATOR_URL=http://cost-estimator:8900
            CERT_SIGN_PRIVATE_KEY=${{ secrets.CERT_SIGN_PRIVATE_KEY }}
            LEAK_WORKER_SECRET=${{ secrets.LEAK_WORKER_SECRET }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            LEAK_PROVER_MCP_CONFIG=${{ secrets.LEAK_PROVER_MCP_CONFIG }}
            LEAK_SYNC_SECRET=${{ secrets.LEAK_SYNC_SECRET }}
            NODE_ENV=production
            EOF

            cat > ~/nextjs-ai-chatbot/docker-compose.prod.yml << COMPOSE
            services:
              nextjs-frontend:
                image: ghcr.io/${REPO}/production-nextjs:latest
                env_file: .env
                container_name: nextjs-proxy
                ports:
                  - "3000:3000"
                environment:
                  - PYTHON_BACKEND_URL=http://python-backend:5328
                restart: always
                depends_on:
                  - python-backend
              python-backend:
                image: ghcr.io/${REPO}/production-python:latest
                env_file: .env
                container_name: python-backend
                expose:
                  - "5328"
                restart: always
              cost-estimator:
                image: ghcr.io/${REPO}/production-estimator:latest
                container_name: cost-estimator
                env_file: .env
                environment:
                  - EST_DB_PATH=/data/runs.db
                  - EST_MODEL_DIR=/models
                expose:
                  - "8900"
                volumes:
                  - estimator-data:/data
                  - estimator-models:/models
                mem_limit: 512m
                restart: always
              leak-worker:
                image: ghcr.io/${REPO}/production-worker:latest
                container_name: leak-worker
                env_file: .env
                environment:
                  - WORKER_KIND=hosted
                  - WORKER_URL=http://nextjs-frontend:3000
                  - WORKER_MODEL=claude-opus-4-8
                restart: always
                depends_on:
                  - nextjs-frontend
            volumes:
              estimator-data:
              estimator-models:
            COMPOSE

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Prune unused images to free disk space (old preview builds)
            docker image prune -af 2>/dev/null || true

            # Kill any stale docker pull from a previous cancelled run.
            # pgrep -x docker matches only the docker binary (not dockerd/bash/grep).
            # The only long-running docker CLI process is a pull, so this is safe.
            pgrep -x docker 2>/dev/null | xargs -r kill 2>/dev/null || true

            rm -f /tmp/deploy-ready /tmp/deploy-failed

            # Pull in background — survives SSH disconnect
            nohup bash -c "
              docker pull ghcr.io/${REPO}/production-nextjs:latest &&
              docker pull ghcr.io/${REPO}/production-python:latest &&
              docker pull ghcr.io/${REPO}/production-estimator:latest &&
              docker pull ghcr.io/${REPO}/production-worker:latest &&
              touch /tmp/deploy-ready ||
              touch /tmp/deploy-failed
            " > /tmp/pull.log 2>&1 &

            echo "Pull started in background (PID: $!)"

      - name: Wait for pull, then start containers
        uses: appleboy/ssh-action@v1.0.3
        env:
          REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          envs: REPO
          script: |
            set -euo pipefail

            echo "Waiting for image pulls to complete..."
            until [ -f /tmp/deploy-ready ] || [ -f /tmp/deploy-failed ]; do
              echo "Still pulling... $(date)"
              sleep 20
            done

            if [ -f /tmp/deploy-failed ]; then
              echo "Pull failed:"
              cat /tmp/pull.log
              exit 1
            fi

            rm -f /tmp/deploy-ready
            cat /tmp/pull.log

            docker compose -f ~/nextjs-ai-chatbot/docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            echo "Deployed successfully"
