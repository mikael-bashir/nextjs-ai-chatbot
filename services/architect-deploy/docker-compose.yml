# Leak Architect stack — Leak XI (mathlib_search), XII (lean_compile gateway),
# XIV (assembly verifier). Build ON the Oracle VM (native arm64):
#
#   docker build -t leak-lean-base ../leak-lean-base     # once (slow: Mathlib cache)
#   docker compose up -d --build
#
# RAM plan for the 12 GB Always Free shape: XII holds POOL_SIZE=2 warm Lean
# daemons (~4-5 GB each), XIV is lazy (warms on first /verify, reaped after
# idle). bootstrap.sh adds an 8 GB swapfile so a certification burst can't
# OOM the box. On a 24 GB PAYG shape, raise XII's POOL_SIZE to 3-4.
services:
  leak-xi:
    build: ../leak-xi
    restart: unless-stopped
    ports:
      - "8011:8011"
    mem_limit: 1g

  leak-xii:
    build: ../leak-xii
    restart: unless-stopped
    ports:
      - "8012:8012"
    environment:
      POOL_SIZE: "${XII_POOL_SIZE:-2}"
      BLUEPRINT_TIMEOUT_S: "600"
      NODE_TIMEOUT_S: "300"
    mem_limit: 11g

  leak-xiv:
    build: ../leak-xiv
    restart: unless-stopped
    ports:
      - "8014:8014"
    environment:
      POOL_SIZE: "1"
      LAZY: "1"
      IDLE_SHUTDOWN_S: "900"
      VERIFY_TIMEOUT_S: "600"
    mem_limit: 7g
